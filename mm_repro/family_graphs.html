<h2 class="sr-only">현재 corpus의 실제 matmul fusion 예제</h2>
<style>
.mm-family{background:var(--widget-background,#fff);color:var(--widget-foreground,#111827);font:14px system-ui;line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,select,.show{font:inherit;border:1px solid var(--widget-border,#d1d5db);border-radius:7px;padding:7px 10px;background:var(--widget-surface,#f5f6f8);color:var(--widget-foreground,#111827)}.tabs button[aria-pressed=true]{background:var(--widget-accent,#4f46e5);color:var(--widget-on-accent,#fff)}.summary{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}.chip{padding:4px 9px;border-radius:6px;background:var(--widget-surface,#f5f6f8)}.muted{color:var(--widget-muted,#6b7280)}svg{width:100%;height:auto;background:var(--widget-background,#fff)}.path{overflow-wrap:anywhere}
</style>
<main class="mm-family"><div class="tabs" id="tabs"></div><div class="summary" id="summary"></div><div id="graph"></div><p id="description"></p><p class="muted">실제 FX dataflow 요약입니다. View/cast와 일부 PW를 묶어 표시했습니다. GPU 단일 kernel compile은 아직 검증하지 않았습니다.</p><button class="show" id="fx" type="button">이 예제의 전체 FX 보기</button><p class="muted path" id="path"></p></main>
<script>
const cases=[
 {name:'1. Chain',count:'순수 chain 24 repro',file:'addmm_8ed26adc744a',description:'4개의 addmm 사이에 tanh가 있습니다. M=128, 중간 weight는 모두 16×16, 마지막 weight는 16×1입니다.',nodes:[[25,115,140,70,'addmm 1','128×16 @ 16×16'],[225,115,140,70,'addmm 2','128×16 @ 16×16'],[425,115,140,70,'addmm 3','128×16 @ 16×16'],[625,115,140,70,'addmm 4','128×16 @ 16×1']],edges:[[165,150,225,150],[365,150,425,150],[565,150,625,150]],labels:[[195,135,'tanh'],[395,135,'tanh'],[595,135,'tanh']]},
 {name:'2. Horizontal → vertical',count:'1 repro · 실제 24회',file:'addmm_bmm_fe4891df3e8d',description:'MobileBERT의 두 병렬 projection이 작은 BMM의 양쪽 operand로 들어갑니다. 처음 M=32768이며 BMM의 contraction K=32입니다. 뒤의 row softmax도 함께 포함됩니다.',nodes:[[15,40,225,65,'addmm Q','32768×128 @ 128×128'],[15,200,225,65,'addmm K','32768×128 @ 128×128'],[370,120,185,70,'bmm','K=32 → [1024,128,128]'],[610,120,160,70,'row softmax','amax → exp → sum → div']],edges:[[240,75,370,138],[240,235,370,173],[555,155,610,155]],labels:[[300,90,'Q: [1024,128,32]'],[300,220,'Kᵀ: [1024,32,128]']]},
 {name:'3. SwiGLU',count:'1 repro · 2 shape points · 60회',file:'mm_bdd1d6cf4c6a',description:'SiLU(X @ W_gate) * (X @ W_up)가 포함됩니다. Qwen·Mistral에서 나온 실제 gating입니다. 큰 down projection은 다음 region 경계로 분리됩니다.',nodes:[[20,45,225,65,'mm gate','1000×1024 @ 1024×3072'],[20,205,225,65,'mm up','1000×1024 @ 1024×3072'],[330,45,140,65,'SiLU','x / (1 + exp(-x))'],[575,125,200,70,'multiply','output: [1000,3072]']],edges:[[245,77,330,77],[470,77,575,142],[245,237,575,178]],labels:[]},
 {name:'4. MM + row reduction',count:'Row reduction 44 repro · normalization 2 repro',file:'addmm_4fb63f9ccc45',description:'실제 Electra 예제는 MM → GELU → layernorm입니다. M=32768, K=256, N=128이며 var_mean이 마지막 128개 feature를 줄입니다.',nodes:[[15,125,175,70,'addmm','32768×256 @ 256×128'],[250,125,120,70,'GELU','[32768,128]'],[420,40,170,70,'var_mean','reduce last axis: 128'],[620,125,155,70,'normalize','(x−mean)·rsqrt(var+ε)']],edges:[[190,160,250,160],[370,142,420,90],[590,80,620,140],[370,183,620,183]],labels:[[495,225,'full tensor + broadcast statistics']]}
];
const fg='var(--widget-foreground,#111827)',muted='var(--widget-muted,#6b7280)',accent='var(--widget-series-1,#4f46e5)',border='var(--widget-border,#d1d5db)';let active=0;
function draw(){const c=cases[active];document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',i===active));document.getElementById('summary').innerHTML='<span class="chip">'+c.count+'</span>';let content='';for(const [x1,y1,x2,y2]of c.edges)content+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${accent}" stroke-width="2" marker-end="url(#arrow)"/>`;for(const [x,y,w,h,a,b]of c.nodes)content+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--widget-surface,#f5f6f8)" stroke="${border}"/><text x="${x+w/2}" y="${y+27}" text-anchor="middle" fill="${fg}" font-size="14">${a}</text><text x="${x+w/2}" y="${y+49}" text-anchor="middle" fill="${muted}" font-size="11">${b}</text>`;for(const[x,y,t]of c.labels)content+=`<text x="${x}" y="${y}" text-anchor="middle" fill="${muted}" font-size="10">${t}</text>`;document.getElementById('graph').innerHTML=`<svg viewBox="0 0 800 310" role="img"><title>${c.name}</title><desc>${c.description}</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="${accent}"/></marker></defs>${content}</svg>`;document.getElementById('description').textContent=c.description;document.getElementById('path').textContent='mm_repro/canonical/'+c.file+'/repro.py';}
cases.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=c.name;b.addEventListener('click',()=>{active=i;draw();});document.getElementById('tabs').appendChild(b);});document.getElementById('fx').addEventListener('click',()=>{if(typeof sendPrompt==='function')sendPrompt('현재 MM fusion family visualizer: '+cases[active].name+'의 실제 FX graph mm_repro/canonical/'+cases[active].file+'/repro.py 를 읽고 MM 연결, tensor shape, epilogue를 설명해줘.');});draw();
</script>
